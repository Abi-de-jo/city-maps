name: city-maps-instabox

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maps_instabox_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-maps}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maps} -d ${POSTGRES_DB:-maps}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - maps-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - maps-network

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-maps_instabox_meili_secret_2026}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 256MiB
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - meili_data:/meili_data
    networks:
      - maps-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maps}:${POSTGRES_PASSWORD:-maps_instabox_secret_2026}@postgis:5432/${POSTGRES_DB:-maps}
      REDIS_URL: redis://redis:6379/0
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-maps_instabox_meili_secret_2026}
      TRAFFIC_API_KEY: ${TRAFFIC_API_KEY:-maps_traffic_key_2026}
      CITY_NAME: ${CITY_NAME:-India}
      CITY_BBOX: '[68.1, 6.7, 97.4, 35.7]'
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - maps-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_CITY_SLUG: ${CITY_SLUG:-india}
        NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-78.9629}
        NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-20.5937}
        NEXT_PUBLIC_MAP_ZOOM: ${NEXT_PUBLIC_MAP_ZOOM:-5}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - maps-network

networks:
  maps-network:
    driver: bridge

volumes:
  postgis_data:
  redis_data:
  meili_data:
