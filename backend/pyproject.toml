[project]
name = "city-maps-api"
version = "1.0.0"
description = "Unified search, routing and place API for a self-hosted city map"
requires-python = ">=3.12"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "redis==5.2.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "ruff==0.9.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
